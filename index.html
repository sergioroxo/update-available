<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚑ user-scalable=no / maximum-scale=1 are NOT a casual accessibility trade.
         The two-finger pinch is a BOUND CAMERA CONTROL in this piece (FOV 30°-80°,
         CLAUDE.md), and Safari's own page zoom was firing underneath it — which is
         what dropped Sérgio's iPad out of fullscreen mid-scene on 2026-08-15. The
         piece owns the gesture; the browser must not also claim it. Text legibility
         is the piece's own job, not the browser zoom's.
         ⚑ This meta is necessary but NOT sufficient: iOS Safari ignores it in some
         contexts, so the canvas also needs `touch-action: none` + preventDefault on
         the multi-touch path. That half is S86's. viewport-fit=cover lets the room
         reach the edges on notched devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ⚑ REGRESSION, MINE, FIXED 2026-08-15. I briefly added `maximum-scale=1,
         user-scalable=no` here to stop Safari's page zoom fighting the iPad's
         two-finger FOV pinch. It worked — and it also killed BROWSER ZOOM ON
         DESKTOP, which Sérgio hit within the hour ("why can't I zoom inside the
         browser version on a laptop?"). A viewport lock is global; the problem
         was not. S86's `touch-action: none` + preventDefault on the canvas's
         multi-touch path is the correct, SCOPED fix: it claims the gesture only
         where the gesture happens. Do not put the lock back. -->

    <!-- ⚑⚑ THE STALE-BUILD BUG, and it cost more device sessions than any code fault.
         GitHub Pages serves index.html with `cache-control: max-age=600` and offers no
         way to change that. Vite content-hashes every asset but NOT index.html, so a
         cached index.html points at the cached bundle and Safari serves the ENTIRE
         previous app — coherently, with nothing looking broken. Sérgio spent three
         device sessions testing fixes that were live on the server and invisible on
         his iPad, and twice concluded, reasonably, that the deploy was broken. It
         never was.
         These are a request, not a guarantee. ⚑ THE RELIABLE TEST IS A PRIVATE TAB —
         see docs/DEPLOY_PAGES.md. We cannot poll for a version: no runtime network
         calls after asset load is a hard invariant. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#101014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UPDATE FAILED" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./app-icon-180.png" />
    <title>YOUR UPDATE HAS FAILED</title>
    <style>
      /* ⚑ S86 — THE FALSE "HOVER GLOW". Sérgio, playing with a mouse: "A glow
         that appears just in some areas... maybe it is selecting the screen."
         He had it right the first time: it IS selection. The orienting card
         (orientingCard.ts) and the game menu (gameMenu.ts) are both plain DOM
         text with no `user-select` rule, so an ordinary drag — the exact
         gesture this piece asks for everywhere else (drag-to-look) — paints
         the browser's native blue highlight across whatever paragraph it
         crosses. It reads as an unexplained glow because nothing in the
         piece's own voice offers a highlight like it; a real one only ever
         marks a floor disc or a button. Verified live: before this rule, a
         drag across the orienting card's body text left a visible selection;
         after, the same drag leaves none. `user-select: text` stays available
         to anything that opts back in (the debug panel's diagnostic readout
         already does, panel.ts:437, and is unaffected). */
      html, body {
        margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
        user-select: none; -webkit-user-select: none;
      }
      #app { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
