# ⚑ AUTO ON PUSH TO `reinterp`, plus manual dispatch for any branch.
#
# It was manual-only until 2026-08-13, on the grounds that publishing is
# outward-facing and this piece has open ethics gates. Sérgio has since settled
# that question (the trial link may be public while the repo stays private), and
# the manual gate then cost him a real afternoon: he tested the DUCK and the
# ENTRANCE TAP on a stale build, because a session had landed a fix that was
# never deployed. His note: "which should be automatically done by you or codex".
#
# ⚑ The gate that actually matters is unchanged and is BELOW, not here: this
# workflow runs `npm test` before it publishes anything, so a build that breaks
# its own invariants still cannot reach a device. And the ethics gates are
# tracked where they belong — 08 §14's BLOCKED-ON-READER-PASS — not by making a
# deploy inconvenient. See docs/DEPLOY_PAGES.md.
name: pages

on:
  push:
    branches: [reinterp]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build and publish'
        required: true
        default: 'reinterp'

# One deploy at a time; a newer run waits rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚑ `inputs.ref` exists only on workflow_dispatch; on a push it is
          #  empty and this falls through to the pushed commit, which is what
          #  you want. Do not "simplify" this to inputs.ref alone.
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ⚑ THE LAWS RUN BEFORE ANYTHING IS PUBLISHED.
      # check-invariants (no network, no storage), check-rooms, and check-spec
      # C1-C8. A build that breaks its own invariants must never reach a device
      # — least of all one someone is testing on.
      - name: Verify the invariants
        run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      # vite.config.ts sets `base: './'`, so the bundle is path-relative and
      # works from a project subpath without knowing the repo name.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
